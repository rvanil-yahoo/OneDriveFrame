; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = COM13
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_HAS_PSRAM
  -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
  -DBOARD_VIEWE_UEDX80480043E_WB_A
lib_deps =
  tzapu/WiFiManager
  bblanchon/ArduinoJson @ ^7.1.0
  siara-cc/Sqlite3Esp32 @ ^2.5
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.3
  esp-arduino-libs/esp-lib-utils @ ^0.3.0
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  bodmer/TJpg_Decoder @ ^1.1.0
